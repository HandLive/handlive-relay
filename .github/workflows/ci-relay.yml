# CI relay: fmt + clippy + test đơn vị (không cần dịch vụ), rồi test tích hợp #[ignore]
# với PostgreSQL 16 + Redis 7 (service container). Mọi giá trị môi trường là giá trị giả của CI.
# Bố cục workspace như máy dev: kho này ở relay/, kho handlive-shared ở shared/ (test đọc ../shared/test-vectors).
# Sửa shared không tự kích hoạt workflow này: chạy tay (workflow_dispatch).
# Kho private trong group cần secret HANDLIVE_REPOS_TOKEN (quyền đọc nội dung các kho); kho public thì github.token đủ.
name: ci-relay

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  commit-policy:
    name: commit đứng tên người thật
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Không có danh tính hay trailer của công cụ AI trong commit mới
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            .githooks/check-commits.sh "$BASE..$HEAD_SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            .githooks/check-commits.sh --max-count=200 "$HEAD_SHA"   # nhánh mới hoặc force-push: kiểm 200 commit gần nhất
          else
            .githooks/check-commits.sh "$BEFORE..$HEAD_SHA"
          fi

  lint-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
        with:
          path: relay

      - name: Kho handlive-shared cạnh relay/
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/handlive-shared
          path: shared
          token: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}

      # rust-version = 1.88 trong Cargo.toml; stable luôn ≥ 1.88.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  integration:
    name: test tích hợp (PostgreSQL 16 + Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: relay
    # Cổng host giống docker-compose.yml (55432, 56379) để khớp .env.example.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: handlive
          POSTGRES_PASSWORD: handlive-dev
          POSTGRES_DB: handlive_relay
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U handlive -d handlive_relay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    # Giá trị giả, chỉ dùng cho CI (giống .env.example); không phải secret.
    env:
      DATABASE_URL: postgres://handlive:handlive-dev@127.0.0.1:55432/handlive_relay
      REDIS_URL: redis://127.0.0.1:56379
      RELAY_JWT_SECRET: ci-only-placeholder-not-a-secret-0123456789abcdef
      RELAY_BIND: 127.0.0.1:8080
      RUST_LOG: info
    steps:
      - uses: actions/checkout@v5
        with:
          path: relay

      - name: Kho handlive-shared cạnh relay/
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/handlive-shared
          path: shared
          token: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay

      - name: cargo test -- --ignored
        run: cargo test -- --ignored
