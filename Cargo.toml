[workspace]
resolver = "3"
members = ["crates/relay-server", "crates/relay-push"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

# Pin the relay stack in one place.
[workspace.dependencies]
actix-web = "4.15"
actix-ws = "0.4"
actix-http = "3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "migrate", "macros"] }
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
ed25519-dalek = "3.0"
ring = "0.17"
uuid = { version = "1.26", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.23"
env_logger = "0.11"
log = "0.4"
subtle = "2.6"
hex = "0.4"
# Push providers (relay-push): HTTP/2 client on rustls with the ring provider
# (no aws-lc), OS trust store through rustls-platform-verifier.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rsa = "0.9"
jsonschema = { version = "0.58", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }

# Test-only RSA key generation (relay-push mocks) is slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
